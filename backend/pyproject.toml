[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-backend"
version = "0.1.0"
description = "Nexora Backend - AI-powered career discovery and application management platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "psycopg[binary]>=3.1.18,<4.0.0",
    "celery>=5.3.6,<6.0.0",
    "redis>=6.1.0",
    "bcrypt>=4.1.0,<5.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pypdf>=4.0.0,<7.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openai>=1.20.0,<3.0.0",
    "google-genai>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.3.4,<1.0.0",
    "mypy>=1.9.0,<2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*", "bcrypt.*", "jwt.*", "docx.*", "pypdf.*", "google.*", "openai.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

